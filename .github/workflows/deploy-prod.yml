name: Deploy to Vercel (tags only)

# Production deploys for apps/web and apps/landing fire ONLY on a v* tag push.
# Vercel's automatic git integration MUST be disconnected for both projects.
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_WEB, VERCEL_PROJECT_ID_LANDING

on:
  push:
    tags:
      - 'v*'
  # Manual trigger — re-deploy a specific tag without retagging.
  # Useful when secrets are rotated or a transient Vercel error blocked the
  # original tag-push run. Pass the tag (or branch) as the workflow ref.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (informational; the workflow checks out the ref the dispatch was triggered on)'
        required: false
        default: ''

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy apps/web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: pnpm install -g vercel@latest
      - name: Pull Vercel env (production)
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (production)
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          # Stamp the build with the release tag for the VersionBadge overlay.
          # Surfaces stale-build regressions during UAT (issue #312).
          VITE_APP_VERSION: ${{ github.ref_name }}
          # Public client-side config. Inlined here because Vercel's per-project
          # env-var storage was silently dropping the values during
          # `vercel env add` (CLI bug observed 2026-05-21 with vercel@54.0.0:
          # `Saving … Added` succeeds but pulled file shows empty strings).
          # These are all public (browser-visible) values — Convex URL +
          # diamond address + demo-mode flag — so workflow-yaml is acceptable
          # storage. If/when the CLI bug is fixed, migrate back to Vercel
          # project env vars + `vercel pull`.
          VITE_CONVEX_URL: https://valuable-kudu-985.convex.cloud
          VITE_CLAN_WORLD_CONTRACT_ADDRESS: '0x098fa5c2dc8372cde5c99db47365fa84b69f7af1'
          VITE_CLANWORLD_DEMO_MODE: 'false'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (production)
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-landing:
    name: Deploy apps/landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: pnpm install -g vercel@latest
      - name: Pull Vercel env (production)
        working-directory: apps/landing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (production)
        working-directory: apps/landing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
          # Stamp the build with the release tag (parity with apps/web; safe
          # no-op if landing doesn't read VITE_APP_VERSION). Issue #312.
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (production)
        working-directory: apps/landing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
