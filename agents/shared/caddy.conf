{
	auto_https off
	servers {
		protocols h1 h2
		timeouts {
			read_body 30s
			read_header 10s
			write 0
			idle 1h
		}
	}
}

:80 {
	encode gzip zstd

	handle /healthz {
		respond "ok" 200
	}

	@bare_elder path /elder-1 /elder-2 /elder-3 /elder-4
	redir @bare_elder {path}/ 308

	handle_path /elder-1/* {
		reverse_proxy elder-1:7681 {
			transport http {
				versions 1.1
			}
		}
	}

	handle_path /elder-2/* {
		reverse_proxy elder-2:7681 {
			transport http {
				versions 1.1
			}
		}
	}

	handle_path /elder-3/* {
		reverse_proxy elder-3:7681 {
			transport http {
				versions 1.1
			}
		}
	}

	handle_path /elder-4/* {
		reverse_proxy elder-4:7681 {
			transport http {
				versions 1.1
			}
		}
	}

	handle /map* {
		reverse_proxy {$CLAN_WORLD_WEB_UPSTREAM:https://clan-world-game.vercel.app} {
			header_up X-Forwarded-Proto https
			header_up Host {upstream_hostport}
		}
	}

	handle {
		reverse_proxy {$CLAN_WORLD_WEB_UPSTREAM:https://clan-world-game.vercel.app} {
			header_up X-Forwarded-Proto https
			header_up Host {upstream_hostport}
		}
	}
}
